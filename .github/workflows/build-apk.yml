
name: Build Account Path APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Unpack project
        run: |
          mkdir buildsrc
          unzip -q account-path-android-project.zip -d buildsrc

      - name: Build APK
        run: gradle --no-daemon -p buildsrc testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: account-path-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
